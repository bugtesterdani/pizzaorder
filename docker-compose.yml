# MittwochsPizza – alles in einem Container, Daten in einem eigenen Volume
#
#   cp env.example .env       # Passwörter setzen!
#   docker compose up -d --build
#
# Optional mit HTTPS (eigene Domain, Ports 80/443 erreichbar) – startet
# zusätzlich einen Caddy-Container als Reverse-Proxy:
#   docker compose --profile https up -d --build

name: pizzaorder

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  pizzaorder:
    <<: *hardening
    build:
      context: .
      args:
        APP_TITLE: ${APP_TITLE:-MittwochsPizza}
    image: pizzaorder:latest
    container_name: pizzaorder
    environment:
      DB_NAME: ${DB_NAME:-pizzaorder}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD in .env setzen}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET in .env setzen}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      MONGO_CACHE_GB: ${MONGO_CACHE_GB:-0.25}
    ports:
      # Bei HTTPS über Caddy in .env: HTTP_PORT=127.0.0.1:8080
      - "${HTTP_PORT:-8080}:8000"
    volumes:
      - pizzaorder-data:/data/db
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    mem_limit: 1g
    pids_limit: 512
    # Zeit für MongoDB, beim Stoppen sauber herunterzufahren
    stop_grace_period: 30s

  caddy:
    <<: *hardening
    image: caddy:2-alpine
    profiles: ["https"]
    cap_add:
      - NET_BIND_SERVICE
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - pizzaorder

volumes:
  # Fester Name, damit das Volume auch mit "docker run" gleich heißt.
  pizzaorder-data:
    name: pizzaorder-data
  caddy-data:
  caddy-config:
