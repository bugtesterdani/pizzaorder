# MongoDB für MittwochsPizza – nur innerhalb des Containers erreichbar.
# Logs landen im Journal:  journalctl -u pizzaorder-db
storage:
  dbPath: /var/lib/pizzaorder/db
  wiredTiger:
    engineConfig:
      cacheSizeGB: 0.25
net:
  bindIp: 127.0.0.1
  port: 27017
  unixDomainSocket:
    enabled: false
systemLog:
  quiet: true
